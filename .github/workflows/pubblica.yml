name: Pubblica edizione delle 20:30

# Il cron di GitHub Actions slitta di parecchi minuti sotto carico.
# Per questo il job parte in largo anticipo e bp.py dorme fino alle 20:30:00
# esatte calcolate da Python su Europe/Rome (ora legale inclusa).
# 17:50 UTC = 19:50 in ora legale · 18:50 in ora solare.
# Si lanciano entrambe le finestre: quella "sbagliata" nella stagione corrente
# trova l'orario gia' passato oltre tolleranza, oppure l'edizione gia' marcata
# come pubblicata, ed esce senza fare nulla.

on:
  # Il cron di Actions non e' puntuale: il 31/07/2026 e' partito con quasi
  # quattro ore di ritardo, mancando l'orario di pubblicazione. Rimedio:
  # cinque tentativi distribuiti nel pomeriggio. Chi si sveglia troppo presto
  # rinuncia e lascia il turno al successivo; chi si sveglia nella finestra
  # utile dorme fino alle 20:30:00 e pubblica. Cosi' l'edizione esce in orario
  # sia col cron puntuale sia con slittamenti fino a cinque ore.
  # Minuti volutamente non tondi: gli orari pieni sono i piu' congestionati.
  schedule:
    - cron: '13 11 * * *'   # 13:13 CEST · 12:13 CET
    - cron: '41 13 * * *'   # 15:41 CEST · 14:41 CET
    - cron: '17 15 * * *'   # 17:17 CEST · 16:17 CET
    - cron: '23 16 * * *'   # 18:23 CEST · 17:23 CET
    - cron: '37 17 * * *'   # 19:37 CEST · 18:37 CET
  workflow_dispatch:
    inputs:
      data:
        description: 'Data ISO da pubblicare (vuoto = oggi)'
        required: false
        type: string
      dry_run:
        description: 'Prova senza pubblicare'
        required: false
        type: boolean
        default: false
      subito:
        description: 'Pubblica adesso invece di aspettare le 20:30'
        required: false
        type: boolean
        default: false

# Rete di sicurezza: due job non pubblicano mai lo stesso giorno in parallelo.
concurrency:
  group: pubblicazione-breaking-past
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # il job dorme fino alle 20:30: serve spazio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Preflight
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python bp.py preflight ${{ inputs.data && format('--date {0}', inputs.data) || '' }}

      - name: Pubblica alle 20:30:00 Europe/Rome
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          HASHTAGS_IN_FIRST_COMMENT: ${{ vars.HASHTAGS_IN_FIRST_COMMENT }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Con "subito" l'orario bersaglio diventa le 00:01 di oggi: essendo
          # gia' passato, lo script smette di aspettare e pubblica all'istante.
          # Sui lanci programmati inputs e' vuoto e valgono i valori normali.
          PUBLISH_HOUR: ${{ inputs.subito && '0' || '20' }}
          PUBLISH_MINUTE: ${{ inputs.subito && '1' || '30' }}
          EARLY_SKIP_MIN: ${{ inputs.subito && '1440' || '240' }}
          LATE_TOLERANCE_MIN: ${{ inputs.subito && '1440' || '240' }}
        run: python bp.py publish ${{ inputs.data && format('--date {0}', inputs.data) || '' }}

      - name: Registra l'avvenuta pubblicazione
        if: success()
        run: |
          if [[ -z "$(git status --porcelain queue.json docs/index.html)" ]]; then
            echo "queue.json invariato: niente da registrare."
            exit 0
          fi
          git config user.name  "breaking-past-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json docs/index.html
          git commit -m "chore: edizione pubblicata $(date -u +%Y-%m-%d)"
          # Il ramo puo' essere avanzato mentre dormivamo: riallineati e riprova.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "::error::impossibile registrare queue.json dopo 3 tentativi"
          exit 1

      - name: Stato finale della coda
        if: always()
        run: python bp.py status || true
